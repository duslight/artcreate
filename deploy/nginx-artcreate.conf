# artcreate nginx 反代示例 —— 配合 systemd 服务（127.0.0.1:8870）
# 路径：/etc/nginx/sites-available/artcreate

server {
    listen 80;
    server_name art.example.com;    # 改成实际域名

    # 大图上传/下载不限速，超时放宽（生成任务轮询可能长连接）
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 50m;       # ref_images 参考图上传

    location / {
        proxy_pass http://127.0.0.1:8870;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS 由 certbot --nginx 自动补写 listen 443 ssl 段，无需手写
