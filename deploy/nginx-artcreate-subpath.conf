# artcreate · nginx 子路径反代（/artcreate/ → 127.0.0.1:8870）
# 插入位置：/etc/nginx/sites-available/default 的 server{} 块内（与 /art/ 旧管线同级）
# 前提：前端已全部改为相对路径（2026-08-27），无需子路径重写规则
#
# 两个 location 必须成对存在：
#   /artcreate/   → 页面与静态资源（proxy_pass 带尾斜杠 = 去前缀转发）
#   /artcreate/   的 api 请求同路径，无需单独规则（相对路径自动带 /artcreate/ 前缀）

location /artcreate/ {
    proxy_pass http://127.0.0.1:8870/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;    # 生图任务轮询长连接
    proxy_send_timeout 300s;
}

# 注意：
# 1. proxy_pass 结尾的 / 不可省——它把 /artcreate/workbench.html 映射为 /workbench.html
# 2. 若出现 502：检查 artcreate systemd 服务是否 active（systemctl status artcreate）
# 3. 前端访问 URL：http://<IP>/artcreate/workbench.html（注意带尾斜杠的规范形式）
