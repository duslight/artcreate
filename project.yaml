# project.yaml — 项目风格配置（"美术圣经"）
# 一个游戏 = 一份此文件。所有产线、字典、门禁阈值从这里派生。
# 密钥一律不进本文件（走 .env）。
#
# 配置加载链（D22）：base.yaml（工具出厂字典） → project.yaml（本文件） → derived/*.yaml（经验晋升）
# 字典（sizes/art_styles/asset_types/moods/constraint_axes）的出厂默认在 artcreate/base.yaml。
# 本文件写同名段即覆盖/合并：dict 按键覆盖，轴列表按 id 合并（同 id 递归合并、新 id 追加）。
# 经验晋升产物由 distill 写 derived/*.yaml，不手改。
project:
  name: "unnamed-project"
  description: "待填写：游戏美术基调一句话"

defaults:
  asset_type: environment_wide
  art_style: pixel_classic
  mood: none
  size: "2688x1792"
  count: 4            # D-设计原则：批量是默认，count=1 是特例

# ---------- 项目级字典覆盖/追加示例（取消注释生效） ----------
# sizes:
#   "2048x2048": { group: 方, label: "项目特供 · 方形" }
# art_styles:
#   pixel_classic:
#     suffix: "…项目定制尾块…"   # 覆盖 base 同键字段
# constraint_axes:
#   - id: human_trace            # 与 base 同 id：合并，可在 options 上追加项目专属选项
#     options:
#       - { id: church_only, label: "教堂",
#           positive: [a small chapel with a steeple],
#           negative: [skyscrapers, vehicles] }

# ---------- Provider 配置（密钥走 .env；ACTIVE_PROVIDER 热插拔） ----------
providers:
  ark:
    name: "火山方舟 · Seedream 4.5"
    endpoint: "https://ark.cn-beijing.volces.com/api/v3/images/generations"
    model: "doubao-seedream-4-5-251128"
    auth: bearer
    watermark: false
    api_key_env: ARK_API_KEY
    # 参考图模式实测约束（D19）：size 总像素必须 ≥369万（2048×2048 起步）
    min_pixels_with_ref: 3686400
  liblib:
    name: "LibLib 开放平台（默认模型）"
    endpoint: "https://openapi.liblibai.cloud"
    auth: hmac
    access_key_env: LIBLIB_ACCESS_KEY
    secret_key_env: LIBLIB_SECRET_KEY
    fixed_size: [1216, 832]
    poll_interval: 5

active_provider: ark

# ---------- LLM 配置（编译器 + 自检 + VLM，全走智谱） ----------
llm:
  compiler:
    model: glm-4-flash
    api_key_env: ZHIPU_API_KEY
    base_url: "https://open.bigmodel.cn/api/paas/v4/"
  vlm:
    model: glm-4v-flash
    api_key_env: ZHIPU_API_KEY
    base_url: "https://open.bigmodel.cn/api/paas/v4/"

# ---------- 机械门禁阈值（阶段3；按画风可覆盖） ----------
# 校准说明：初版按实测基线放宽（像素化后实测 1400-2600 色 / 网格规则度 0.75-0.94），
# 先建立统计基线，再逐步收紧到像素画理想值（64 色 / 0.98）。
gates:
  mechanical:
    palette:
      max_colors: 64            # 主色数 N
      coverage_ratio: 0.50      # top-64 色覆盖像素比例下限
      # 校准记录：真实像素画理想 ≥90%；当前出图实测 54-70%（后处理未做调色板量化，
      # 渐变噪声色多）。阈值先定 50% 保证流水（拦极端跑偏），待 postprocess 增加
      # palette quantize 步骤后收紧到 90。
      quantize_level: 6         # 颜色量化位深（每通道 2^n）
    grid:
      max_deviation: 0.30       # 规则度 ≥0.70（实测 0.75-0.94；理想 0.02 偏差）
    alpha:
      require_clean: true       # 边缘透明必须干净（半透明像素占比上限）
      edge_semi_alpha_max: 0.05
    size:
      exact_match: true         # 输出尺寸必须与 spec 声明一致
  # 按画风覆盖示例：occult_card 手绘风放宽调色板
  by_style:
    occult_card:
      palette:
        max_colors: 4096
