# base.yaml — 工具出厂默认字典（随代码同版本，请勿在项目里直接改）
# 配置加载链（D22）：base.yaml（本文件） → project.yaml（项目定制） → derived/*.yaml（经验晋升）
# 深合并语义：
#   dict 按键递归合并（后层覆盖同键标量）
#   list 元素若全为含 id 的 dict → 按 id 深合并（同 id 递归合并，新 id 追加）
#   其余 list / 类型不匹配 → 后层整体替换
# 项目要改字典：写 project.yaml 同名段覆盖；经验晋升：由 distill 写 derived/axes_evolved.yaml

# ---------- 分辨率档位（Seedream 4.5 实测约束：总像素 [369万,1677万]，宽高比 [1:16,16:1]） ----------
sizes:
  "4032x1728": { group: 横, label: "超宽 · 电影感横幅" }
  "3840x2160": { group: 横, label: "宽屏 · 网页/视频通用" }
  "2688x1792": { group: 横, label: "经典横 · 通用场景" }
  "3200x2400": { group: 横, label: "端正横 · 室内/物件陈列" }
  "2688x2688": { group: 方, label: "方形 · 图标底/卡背" }
  "1792x2688": { group: 竖, label: "经典竖 · 卡片立绘" }
  "2304x4096": { group: 竖, label: "长竖 · 手机全屏" }
  "1920x3840": { group: 竖, label: "长条竖 · 旗帜/公告板" }

# ---------- 画风预设（白名单制：整尾块按画风切换，防条款自相矛盾 D13） ----------
# conflict_words：与该画风互斥的渲染词（L1 画风冲突检查数据源，schema v2）
# desc：表单展示的一句人话解释（无美术背景的策划可读懂）
art_styles:
  pixel_classic:
    label: "经典像素（Dead Cells / Blasphemous）"
    desc: "高密度像素风，参考《死亡细胞》《渎神》：深色调、清晰描边、抖动渐变。适合大部分场景资产"
    compiler_hint: "dense pixel-art scene"
    suffix: "Deep muted palette, crisp dark outlines, high pixel density, layered dithering, detailed pixel rendering, no text, no watermark, in the style of Dead Cells and Blasphemous environmental art"
    conflict_words: ["手绘", "水墨", "水彩", "油画", "厚涂", "铅笔画",
                     "photorealistic", "hand-drawn", "ink wash", "watercolor", "oil painting"]
  occult_card:
    label: "密教模拟器（暗色手绘神秘卡牌）"
    desc: "暗色手绘卡牌风，参考《密教模拟器》：墨水+水彩质感、神秘符号、羊皮纸底色。适合卡面/UI 装饰"
    compiler_hint: "dark occult hand-drawn illustration"
    suffix: "Dark muted palette, hand-drawn occult illustration, ink and gouache textures, esoteric symbolism, aged parchment tones, fine crosshatching, ornate borders, no text, no watermark, in the style of Cultist Simulator card art"
    conflict_words: ["像素", "pixel art", "pixel-art", "像素画"]

# ---------- 资产类型 → 媒介声明前缀（按构图本质分类 D16） ----------
asset_types:
  environment_wide:
    label: "场景全景"
    desc: "完整空间纵深，人视角站在场景中"
    prefix: "Pixel art atmospheric scene with deep spatial perspective"
  backdrop:
    label: "背景底图"
    desc: "平缓构图弱纵深，留负空间供 UI 叠加"
    prefix: "Pixel art backdrop illustration, flat composition with generous negative space"
  prop:
    label: "单体物件"
    desc: "居中特写，单一主体，无环境叙事"
    prefix: "Pixel art single prop illustration, centered subject on plain ground"
  card_art:
    label: "卡面插画"
    desc: "竖构图，主体焦点，自带边框感"
    prefix: "Pixel art vertical card illustration with framed border feel"
  texture:
    label: "纹理图案"
    desc: "可平铺材质表面（木纹/石面/织物）"
    prefix: "Pixel art seamless tileable texture pattern"
  # 角色模式专用（applies_to: character 过滤，场景表单不显示）
  character_full:
    label: "角色立绘"
    desc: "单角色全身像：干净剪影、居中构图、纯色/简洁背景（作形象基准）"
    prefix: "Pixel art full-body character portrait, clean silhouette, centered composition, simple background"
  character_sheet:
    label: "角色三视图"
    desc: "同一角色正/侧/背三面并列，比例一致（设定表）"
    prefix: "Pixel art character turnaround sheet, front side and back views aligned, consistent proportions, neutral background"

# ---------- 氛围原型 → 光影氛围注入词（每条 = 单一光源概念 + 可执行物理描述） ----------
# desc：光照作用的完整解释（表单选中即显示，解决"简写看不懂"）
# ui_hidden: true：表单不再显示但编译仍兼容（旧 spec 引用不报错）
# 2026-08-25 精简 13→9：月斑与雾并入雾锁迷城、破暗光涌并入光影分界/困缩光池、
# 沉水微光/暮色将尽题材过窄转 ui_hidden
moods:
  none:            { label: "不指定", inject: "",
                     desc: "光照交给模型自由发挥，适合无明确氛围要求的物件/纹理" }
  light_divide:    { label: "光影分界", inject: "a sharp diagonal light/shadow divide cutting across the scene, one warm light source versus cold ambient light",
                     desc: "画面被一道斜切线分成明暗两半：一侧暖光源、一侧冷环境光。戏剧张力最强，适合对峙/冲突感场景" }
  confined_glow:   { label: "困缩光池", inject: "a small pool of warm light ending in a hard edge, surroundings sinking into deep darkness",
                     desc: "一小片暖光被黑暗包围，边界生硬。篝火/烛光/洞窟感，强调安全区之小与危险之近" }
  candle_flicker:  { label: "烛光摇曳", inject: "flickering candlelight, dancing unsteady shadows, warmth barely holding back the dark",
                     desc: "不稳定的光源，影子随火苗晃动。室内/祭祀/幽闭感，暖光勉强抵御黑暗" }
  fog_veil:        { label: "雾锁迷城", inject: "thick fog swallowing distant forms, diffused pale light, silhouettes fading into haze",
                     desc: "浓雾吞掉远处形体，光被雾漫射成灰白。远景/神秘/迷失感，也覆盖月斑光柱类效果" }
  eldritch_glow:   { label: "魇祟辉光", inject: "sickly unnatural glow from an unseen source, green-teal luminescence, shadows bending wrong",
                     desc: "来源不明的病态辉光（青绿色），影子朝错误方向弯。克苏鲁/污染/异常感" }
  hallowed_rays:   { label: "圣眷垂光", inject: "volumetric god rays descending from above, dust motes in sacred light, reverent stillness",
                     desc: "从上方垂落的体积光柱，尘埃在光中漂浮。神殿/圣所/庄严感" }
  radiant_day:     { label: "明媚天光", inject: "bright clear daylight, clean vivid colors, soft scattered clouds, gentle breeze in the air",
                     desc: "明亮清澈的日光，色彩干净鲜艳。明快/日常/村庄感，与全部暗色氛围对立" }
  pitch_dark:      { label: "极暗深黢", inject: "near-total darkness, faint cool outlines barely visible, a single distant pinprick of light",
                     desc: "近乎全黑，只留冷色轮廓与远处一点微光。恐惧/深渊/最低可见度" }
  # ---- ui_hidden（编译兼容，表单不显示） ----
  moon_patches:    { label: "月斑与雾", inject: "thin moonbeams breaking through, dappled pale light patches, drifting mist", ui_hidden: true,
                     desc: "（已并入雾锁迷城）" }
  void_burst:      { label: "破暗光涌", inject: "a burst of warm golden light from one corner, darkness receding with cracked shadows", ui_hidden: true,
                     desc: "（并入光影分界/困缩光池）" }
  drowned_light:   { label: "沉水微光", inject: "light filtering down through deep water, rippling caustics, suspended drift", ui_hidden: true,
                     desc: "（题材过窄，需要时用自由约束写）" }
  twilight_lament: { label: "暮色将尽", inject: "last dying light of dusk, long stretched shadows, sky bleeding into darkness", ui_hidden: true,
                     desc: "（题材过窄，需要时用自由约束写）" }

# ---------- 约束合集（语义轴 D12：用户选意图，系统展开预写英文词组，不依赖 LLM） ----------
# 字典 schema v2：
#   轴选项 verify_question：L3 意图回查问句（必须构造为"是否满足约束"形式，
#     肯定回答=满足，与 audit._parse_yesno 协议对齐）；省略则该选项跳过 L3 验图
#   source：base（出厂）/ manual（project 手写）/ distilled（经验晋升），distill 写入
#   confidence：distill 置信度 0-1，仅 distilled 项携带
#   轴级 non_promotable: true 时整轴禁止晋升（关系约束等无法独立成轴的语义）
constraint_axes:
  # applies_to：轴适用模式（scene=场景/静物表单，character=角色表单；缺省=两者通用）
  - id: human_trace
    label: "人工痕迹"
    desc: "画面里是否出现人造物（建筑/道路/桥梁/机械等）"
    applies_to: [scene]
    options:
      - { id: any,      label: "不限" }
      - { id: natural,  label: "完全自然",
          negative: [bridges, roads, buildings, fences, farmland, ships, machinery],
          positive: [pristine untouched wilderness],
          zh: { negative: ["桥梁", "道路", "建筑", "栅栏", "农田", "船舶", "机械"],
                positive: ["原始未触动的荒野"] },
          verify_question: "画面中是否完全没有人工建筑/道路/桥梁等人造物？" }
      - { id: present,  label: "有人工痕迹",
          positive: [weathered man-made structures, worn stone paths],
          zh: { positive: ["风化的人造结构", "磨损的石径"] },
          verify_question: "画面中是否有人工痕迹（建筑/道路/桥梁等）？" }
  - id: water
    label: "水体"
    desc: "画面里是否有河流/湖泊/水塘等水面"
    applies_to: [scene]
    options:
      - { id: any,      label: "不限" }
      - { id: none,     label: "无水体",
          negative: [rivers, streams, lakes, ponds, waterfalls, "flooded water", puddles],
          zh: { negative: ["河流", "溪流", "湖泊", "池塘", "瀑布", "积水", "水洼"] },
          verify_question: "画面中是否完全没有河流/湖泊/水塘等水体？" }
      - { id: present,  label: "有水体",
          positive: [a water feature woven into the terrain],
          zh: { positive: ["水景自然融入地形"] },
          verify_question: "画面中是否有水体（河流/湖泊/水塘等）？" }
  - id: enclosure
    label: "空间"
    desc: "开阔（见天）还是密闭（室内/洞窟）"
    applies_to: [scene]
    options:
      - { id: any,      label: "不限" }
      - { id: open,     label: "开阔",
          negative: [interior walls, ceilings, "door frames", cave tunnels],
          positive: [vast open sky, wide horizon],
          zh: { negative: ["室内墙体", "天花板", "门框", "洞穴隧道"],
                positive: ["开阔天空", "辽阔地平线"] },
          verify_question: "画面是否是开阔场景（能看到天空/地平线）？" }
      - { id: enclosed, label: "密闭",
          negative: [open sky, vast horizons, distant landscapes],
          positive: [claustrophobic enclosed space, low ceilings pressing down],
          zh: { negative: ["开阔天空", "辽阔地平线", "远景地貌"],
                positive: ["幽闭密闭空间", "低压天花板"] },
          verify_question: "画面是否是封闭室内/洞穴场景（看不到开阔天空）？" }
  - id: vegetation
    label: "植被"
    desc: "植物覆盖程度：荒芜还是繁茂"
    applies_to: [scene]
    options:
      - { id: any,      label: "不限" }
      - { id: barren,   label: "荒芜",
          negative: [lush vegetation, forests, "thick foliage", "flowering plants", "mossy growth"],
          positive: [bare barren ground, "dead twisted branches"],
          zh: { negative: ["茂密植被", "森林", "厚重枝叶", "开花植物", "苔藓生长"],
                positive: ["裸露荒芜地表", "枯死扭曲的枝干"] },
          verify_question: "画面是否几乎没有植被（荒芜地表）？" }
      - { id: lush,     label: "繁茂",
          positive: [dense overgrown vegetation, plants reclaiming the space],
          zh: { positive: ["稠密疯长的植被", "植物重新占据空间"] },
          verify_question: "画面是否有茂密植被？" }

  # ---- 角色模式轴（applies_to: character） ----
  - id: char_frame
    label: "取景"
    desc: "立绘取景范围：全身还是半身"
    applies_to: [character]
    options:
      - { id: any,      label: "不限" }
      - { id: full,     label: "全身",
          positive: ["full body visible head to toe", "complete figure within frame"],
          zh: { positive: ["从头到脚全身可见", "完整人物在画框内"] },
          verify_question: "画面中角色是否全身可见（头到脚完整）？" }
      - { id: half,     label: "半身",
          negative: ["full body", "legs visible", "feet visible"],
          positive: ["upper body portrait, waist-up framing"],
          zh: { negative: ["全身", "腿部可见", "脚部可见"],
                positive: ["上半身像，腰部以上取景"] },
          verify_question: "画面是否为半身取景（腰部以上）？" }
  - id: char_bg
    label: "背景"
    desc: "立绘背景复杂度（影响抠图与复用）"
    applies_to: [character]
    options:
      - { id: any,      label: "不限" }
      - { id: plain,    label: "纯色简洁",
          negative: ["detailed background", "complex scenery", "environment scene"],
          positive: ["flat solid color background", "simple gradient backdrop"],
          zh: { negative: ["复杂背景", "环境场景"],
                positive: ["纯色平涂背景", "简洁渐变背景"] },
          verify_question: "背景是否为纯色/简洁（无环境场景细节）？" }
      - { id: scenic,   label: "带场景",
          positive: ["character within a themed environment"],
          zh: { positive: ["角色置身主题环境中"] },
          verify_question: "画面是否带主题场景背景？" }
  - id: char_facing
    label: "朝向"
    desc: "角色面向（三视图/动作变体的朝向基准）"
    applies_to: [character]
    options:
      - { id: any,      label: "不限" }
      - { id: front,    label: "正面",
          positive: ["facing forward toward viewer", "front view"],
          zh: { positive: ["面向观者", "正面视角"] },
          verify_question: "角色是否正面朝向观者？" }
      - { id: side,     label: "侧面",
          positive: ["side profile view"],
          zh: { positive: ["侧面轮廓视角"] },
          verify_question: "角色是否为侧面视角？" }
      - { id: back,     label: "背面",
          positive: ["back view, facing away from viewer"],
          zh: { positive: ["背面，背向观者"] },
          verify_question: "角色是否背向观者？" }
  - id: char_light
    label: "打光"
    desc: "立绘光源方式（角色页替代「氛围」：氛围是场景概念，角色只需光）"
    applies_to: [character]
    options:
      - { id: any,      label: "不限" }
      - { id: neutral,  label: "均匀平光",
          positive: ["even neutral studio lighting, soft uniform illumination, no dramatic shadows"],
          zh: { positive: ["均匀中性布光，柔和统一照明，无戏剧阴影"] },
          verify_question: "角色是否为均匀平光（无强烈明暗对比）？" }
      - { id: rim,      label: "轮廓光",
          positive: ["strong rim lighting, glowing edge light outlining the silhouette from behind"],
          zh: { positive: ["背后轮廓光勾勒剪影边缘"] },
          verify_question: "角色边缘是否有明显轮廓光？" }
      - { id: dramatic, label: "戏剧明暗",
          positive: ["dramatic chiaroscuro lighting, strong light-shadow contrast, single hard key light"],
          zh: { positive: ["戏剧明暗对照，强光影对比，单一硬主光"] },
          verify_question: "角色是否有强烈的明暗对比打光？" }
      - { id: warm_fire, label: "暖光源",
          positive: ["warm firelight glow from one side, amber tones on skin and armor"],
          zh: { positive: ["单侧暖火光，琥珀色调落在皮肤与护甲上"] },
          verify_question: "角色是否被暖色光源照亮？" }

# ---------- 角色动作字典（7-B：pose-batch 逐项注入的预写英文动作词） ----------
# inject：姿态/重心/肢体/表情四要素的纯英文物理描述（与 moods.inject 同哲学：不依赖 LLM 现编）
# desc：表单勾选时显示的人话解释；扩展位勾选计费，不用不花钱
character_poses:
  idle:   { label: "待机", inject: "standing idle pose, relaxed neutral stance, weight balanced on both feet, calm expression",
            desc: "基础站姿待机帧。角色设定展示/头像/横版待机动画用" }
  walk:   { label: "行走", inject: "walking pose mid-stride, one leg forward, arms swinging naturally, body leaning slightly forward",
            desc: "行走循环帧。侧面/正面走图，动作幅度小" }
  attack: { label: "攻击", inject: "dynamic attack pose, weapon swung mid-swing, strong forward lunge, motion energy, determined expression",
            desc: "攻击动作帧。武器挥出中段+前倾发力，动作幅度大" }
  hit:    { label: "受击", inject: "hit reaction pose, body recoiling backward, head thrown back, arms flung outward, pain expression",
            desc: "受击反馈帧。后仰失衡+痛苦表情，注意与倒地区分" }
  skill:  { label: "技能", inject: "casting skill pose, arms raised channeling energy, glowing magical effect around hands or weapon, focused expression",
            desc: "技能施放帧。施法姿态+手部/武器能量特效" }
  death:  { label: "倒地", inject: "defeated falling pose, body collapsing to the ground, limbs limp, dropped weapon, eyes closed",
            desc: "死亡/倒地帧。瘫倒+武器脱手，横版战斗终态" }
  # ---- 扩展位 ----
  cast:   { label: "起手", inject: "wind-up casting pose, arms gathering energy inward before release, coiled tense posture, anticipation",
            desc: "技能起手帧。与技能帧成对使用构成前后摇（cast→skill）" }
  jump:   { label: "跳跃", inject: "jumping pose airborne, knees tucked up, arms extended for balance, dynamic upward motion",
            desc: "跳跃帧。腾空收腿+手臂展开，平台跳跃/闪避用" }
  sprint: { label: "冲刺", inject: "sprinting pose at full speed, deep forward lean, elbows back, one leg fully extended pushing off, motion lines",
            desc: "冲刺帧。极端前倾+后摆臂，跑图/突进技用（motion lines 若与画风冲突可在 project.yaml 去掉）" }

# ---------- 资产后缀字典（命名条目：主名手输 + 后缀拉选，拍板发布 exports/final/） ----------
# id 即后缀本身（含下划线）；动作批量不走这里（自动命名 = 角色名_动作）
asset_suffixes:
  none:  { label: "无后缀", desc: "首个定稿，主名即文件名" }
  v2:    { label: "_v2 版本迭代", suffix: "_v2", desc: "同资产换版（重画/大改）" }
  v3:    { label: "_v3 版本迭代", suffix: "_v3", desc: "第三版" }
  alt:   { label: "_alt 平行方案", suffix: "_alt", desc: "同版换方向（A/B 方案并存）" }
  hd:    { label: "_hd 高清版", suffix: "_hd", desc: "高清放大版（如 2x）" }
  icon:  { label: "_icon 图标", suffix: "_icon", desc: "缩略图标版（UI 头像/物品栏）" }
  sheet: { label: "_sheet 三视图", suffix: "_sheet", desc: "角色三视图/设定表" }
