<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>artcreate · 资产评审</title>
<style>
  :root { --bg:#141517; --panel:#1e2023; --line:#2c2f33; --txt:#d8dad9;
          --dim:#8a8f94; --acc:#4f9cf9; --ok:#3fb96f; --bad:#e05555; --warn:#e0a34f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt);
         font:14px/1.6 "Segoe UI","Microsoft YaHei UI",system-ui,sans-serif; padding:20px; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#2c2f33; border-radius:5px; }
  ::-webkit-scrollbar-thumb:hover { background:#3a3f45; }
  h1 { font-size:18px; margin-bottom:4px; letter-spacing:.3px; }
  h1::before { content:""; display:inline-block; width:11px; height:11px; border-radius:3px;
               background:linear-gradient(135deg,var(--acc),#8f6ff9); margin-right:9px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
  .layout { display:grid; grid-template-columns:260px 1fr; gap:16px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px;
           box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .runs { padding:8px; max-height:82vh; overflow:auto; }
  .run-item { padding:8px 10px; border-radius:6px; cursor:pointer; margin-bottom:4px;
              transition:background .15s; }
  .run-item:hover { background:#26292d; }
  .run-item.active { background:rgba(79,156,249,.14); border:1px solid var(--acc); }
  .run-item .rid { font-size:12px; word-break:break-all; }
  .run-item .rmeta { color:var(--dim); font-size:11px; }
  .main { padding:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; margin-top:12px; }
  .card { background:#22252a; border:1px solid var(--line); border-radius:8px; overflow:hidden;
          transition:border-color .15s, box-shadow .15s; }
  .card:hover { border-color:#3a3f45; box-shadow:0 4px 14px rgba(0,0,0,.35); }
  .card img { width:100%; display:block; cursor:zoom-in; transition:filter .15s; }
  .card img:hover { filter:brightness(1.06); }
  .card .bar { display:flex; align-items:center; gap:8px; padding:8px 10px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; }
  .b-generated { background:#3a3f45; color:#cfd3d6; }
  .b-gated { background:#1f4a30; color:var(--ok); }
  .b-accepted { background:#173f2a; color:#5fd58f; outline:1px solid var(--ok); }
  .b-rejected { background:#4a2323; color:#ff8d8d; }
  .spacer { flex:1; }
  /* 按钮三级：secondary 默认 / ok / no（评审页无 .go 主行动） */
  button { background:transparent; color:var(--txt); border:1px solid var(--line);
           border-radius:6px; padding:5px 12px; cursor:pointer; font-size:12px;
           transition:border-color .15s, color .15s, background .15s, box-shadow .15s; }
  button:hover { border-color:#4a5058; background:rgba(255,255,255,.04); }
  button:active { transform:translateY(1px); }
  button.ok { color:var(--ok); border-color:rgba(63,185,111,.45); }
  button.ok:hover { border-color:var(--ok); background:rgba(63,185,111,.08); }
  button.no { color:var(--bad); border-color:rgba(224,85,85,.45); }
  button.no:hover { border-color:var(--bad); background:rgba(224,85,85,.08); }
  .checks { padding:4px 10px 8px; color:var(--dim); font-size:11px; }
  .checks .f { color:var(--bad); }
  .checks .p { color:var(--ok); }
  .prompt { background:#191b1e; border:1px solid var(--line); border-radius:6px;
            padding:10px; font-size:11px; color:var(--dim); margin-top:10px;
            max-height:110px; overflow:auto; word-break:break-all; }
  .empty { color:var(--dim); padding:60px; text-align:center; }
  dialog { background:var(--panel); color:var(--txt); border:1px solid var(--line);
           border-radius:10px; max-width:92vw; max-height:92vh; }
  dialog img { max-width:88vw; max-height:84vh; display:block; }
  .lin { font-size:13px; }
  .lin .node { padding:4px 10px; border:1px solid var(--line); border-radius:6px;
               display:inline-block; margin:3px 4px; cursor:pointer;
               transition:border-color .15s, color .15s; }
  .lin .node:hover { border-color:#4a5058; }
  .lin .cur { border-color:var(--acc); color:var(--acc); }
</style>
</head>
<body>
<h1>artcreate · 资产评审</h1>
<div class="sub">候选网格 → 接受 / 拒绝（带码）→ 门禁与回查报告就地查看</div>
<div class="layout">
  <div class="panel runs" id="runs">加载中…</div>
  <div class="panel main" id="main"><div class="empty">左侧选择一次 run</div></div>
</div>
<dialog id="zoom"><img id="zoomImg" onclick="this.parentElement.close()"></dialog>
<script>
let curRun = null;

async function loadRuns() {
  const rs = await (await fetch('/api/runs')).json();
  const el = document.getElementById('runs');
  el.innerHTML = rs.map(r => `
    <div class="run-item ${curRun===r.run_id?'active':''}" onclick="sel('${r.run_id}')">
      <div class="rid">${r.run_id}</div>
      <div class="rmeta">${r.subject} · rev${r.revision} · ${r.size} · ${r.created_at}</div>
      ${r.pose ? `<div class="rmeta" style="color:var(--acc)">动作：${r.pose}</div>` : ''}
    </div>`).join('') || '<div class="empty">暂无 run</div>';
}

async function sel(runId) {
  curRun = runId;
  loadRuns();
  const d = await (await fetch(`/api/runs/${runId}/candidates`)).json();
  curData = d;
  render(d);
  loadConsistency(runId);
}

let consMap = {};
async function loadConsistency(runId) {
  consMap = {};
  try {
    const r = await fetch(`/api/runs/${runId}/consistency`, {headers:H()});
    if (!r.ok) return;
    const d = await r.json();
    d.reports.forEach(x => consMap[x.idx] = x);
    document.querySelectorAll('.card').forEach(card => {
      const idx = parseInt(card.dataset.idx);
      const c = consMap[idx];
      if (!c) return;
      const color = c.verdict === 'consistent' ? 'var(--ok)' :
                    c.verdict === 'too_similar' ? 'var(--warn)' :
                    c.verdict === 'drift_risk' ? 'var(--bad)' : 'var(--dim)';
      card.querySelector('.bar').insertAdjacentHTML('afterbegin',
        `<span class="badge" style="background:#26292d;color:${color}" title="${c.hint}">Δ${c.distance}</span>`);
    });
  } catch (e) { /* 无锚点静默 */ }
}

function badge(s) {
  return `<span class="badge b-${s}">${s}</span>`;
}

function render(d) {
  const m = document.getElementById('main');
  const cards = d.candidates.map(c => {
    const rep = c.gate_report || {};
    const mech = (rep.checks||[]).map(x =>
      `<div class="${x.pass?'p':'f'}">${x.pass?'✓':'✗'} ${x.name}: ${x.detail}</div>`).join('');
    const l3 = rep.l3 ? (rep.l3.results||[]).map(x =>
      `<div class="${x.ok?'p':'f'}">${x.ok?'✓':'✗'} ${x.source}${x.ok?'':' — '+x.answer}</div>`).join('') : '';
    return `
    <div class="card" data-idx="${c.idx}">
      <img src="/api/images/${d.run.subject}/${d.run.run_id}/${c.file}"
           onclick="zoom(this.src)" loading="lazy">
      <div class="bar">
        <span>#${c.idx}</span> ${badge(c.status)}
        ${c.reject_code ? `<span style="color:var(--dim);font-size:11px">${c.reject_code}</span>` : ''}
        <span class="spacer"></span>
        <button class="ok" onclick="act('accept',${c.idx})">接受</button>
        <button class="no" onclick="act('reject',${c.idx})">拒绝</button>
      </div>
      ${(mech||l3) ? `<div class="checks">${mech}${l3}</div>` : ''}
    </div>`;
  }).join('');
  m.innerHTML = `
    <div><b>${d.run.subject}</b> · ${d.run.run_id} · rev${d.run.revision} · ${d.run.size}
      <button onclick="showLineage()" style="margin-left:8px">迭代链</button>
      <button onclick="regen()" style="margin-left:4px">再生一批</button>
      <button onclick="loadThisRun()" style="margin-left:4px">载入迭代</button></div>
    <div class="prompt">${d.run.prompt}</div>
    <div id="explain-panel" style="display:none;background:#191b1e;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;margin-top:8px;max-height:260px;overflow:auto"></div>
    <div style="margin-top:6px"><button onclick="toggleExplain()">编译对照（中文全貌）</button></div>
    <div id="lineage"></div>
    <div class="grid">${cards}</div>`;
}
let explainLoaded = false;
function toggleExplain() {
  const p = document.getElementById('explain-panel');
  p.style.display = p.style.display === 'none' ? '' : 'none';
  if (!explainLoaded && p.style.display !== 'none') loadExplain();
}
async function loadExplain() {
  const r = await fetch(`/api/spec/${curRun}`, {headers:H()});
  if (!r.ok) return;
  const d = await r.json();
  const p = document.getElementById('explain-panel');
  p.innerHTML = (d.explain || []).map(s => `
    <div style="margin-bottom:8px">
      <div style="color:var(--acc)">【${s.section}】</div>
      <div>${s.zh}</div>
      <div style="color:var(--dim);font-size:11px;margin-top:2px;word-break:break-all">${s.en}</div>
    </div>`).join('') || '<div style="color:var(--dim)">（无可解释分段）</div>';
  explainLoaded = true;
}
function loadThisRun() {
  // 载入迭代：嵌入工作台时 postMessage 通知父页切换；独立打开时跳转兜底
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'ac-iterate', runId: curRun }, '*');
  } else {
    localStorage.setItem('ac-goto-iterate', curRun);
    location.href = '/workbench.html';
  }
}

async function regen() {
  if (!confirm('同 spec 再生成一批？（revision 不变，记录迭代链）')) return;
  const r = await fetch(`/api/runs/${curRun}/regenerate`, {method:'POST', headers:H()});
  if (r.ok) { const j = await r.json(); alert('已入队，任务 #' + j.job_id); loadRuns(); }
  else alert('入队失败');
}

async function act(kind, idx) {
  if (kind === 'reject') {
    const code = prompt('拒绝码（style_drift / composition / constraint_violation / other）:', 'manual');
    if (code === null) return;
    await fetch(`/api/runs/${curRun}/candidates/${idx}/reject?code=${encodeURIComponent(code)}`, {method:'POST', headers:H()});
  } else {
    const r = await fetch(`/api/runs/${curRun}/candidates/${idx}/accept`, {method:'POST', headers:H()});
    const d = await r.json().catch(() => ({}));
    if (d.final_name) {
      const evs = document.querySelectorAll(`.card[data-idx="${idx}"] .bar .badge.b-accepted`);
      alert(`已拍板并发布：\nexports/final/${d.final_name}.png`);
    }
  }
  sel(curRun);
}

// ---- 轻量身份 + 工作台联动 ----
function meId() {
  let v = localStorage.getItem('ac-uuid');
  if (!v) { v = 'u-' + Math.random().toString(36).slice(2, 10); localStorage.setItem('ac-uuid', v); }
  return v;
}
function H() {
  const h = { 'X-Actor-Id': meId() };
  if (localStorage.getItem('ac-name')) h['X-Actor-Name'] = localStorage.getItem('ac-name');
  const t = localStorage.getItem('ac-token');
  if (t) h['X-Token'] = t;
  return h;
}
async function showLineage() {
  const d = await (await fetch(`/api/runs/${curRun}/lineage`, {headers:H()})).json();
  const chain = [...d.ancestors, {run_id: curRun, cur: true}, ...d.children];
  const html = `<div class="lin">${chain.map(n =>
    `<span class="node ${n.cur?'cur':''}" onclick="sel('${n.run_id}')">${n.run_id}${n.revision ? ' · rev' + n.revision : ''}</span>`
    + (n === d.ancestors[d.ancestors.length-1] ? ' → ' : '')).join('')}</div>`;
  // 简单纵向排列（迭代链）
  document.getElementById('lineage').innerHTML =
    `<div style="color:var(--dim);font-size:12px;margin-top:10px">迭代链（旧 → 新，点击切换）</div>` + html;
}

function zoom(src) {
  document.getElementById('zoomImg').src = src;
  document.getElementById('zoom').showModal();
}

loadRuns().then(() => {
  const go = localStorage.getItem('ac-goto-run');
  if (go) { localStorage.removeItem('ac-goto-run'); sel(go); }
});

// 嵌入工作台时：接收父页指定的 run（页内切换不整页跳转）
window.addEventListener('message', (ev) => {
  if (ev.data && ev.data.type === 'ac-select-run' && ev.data.runId) {
    sel(ev.data.runId);
  }
});
</script>
</body>
</html>
