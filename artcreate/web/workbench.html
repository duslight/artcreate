<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>artcreate · 工作台</title>
<style>
  :root { --bg:#141517; --panel:#1e2023; --line:#2c2f33; --txt:#d8dad9;
          --dim:#8a8f94; --acc:#4f9cf9; --ok:#3fb96f; --bad:#e05555; --warn:#e0a34f;
          --gold:#e0c34f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt);
         font:14px/1.6 "Segoe UI","Microsoft YaHei UI",system-ui,sans-serif; padding:12px; max-width:960px; margin:0 auto; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#2c2f33; border-radius:5px; }
  ::-webkit-scrollbar-thumb:hover { background:#3a3f45; }
  h1 { font-size:17px; margin-bottom:2px; letter-spacing:.3px; }
  h1::before { content:""; display:inline-block; width:10px; height:10px; border-radius:3px;
               background:linear-gradient(135deg,var(--acc),#8f6ff9); margin-right:9px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:12px; }

  /* ---- 导航：标签页化（去按钮盒） ---- */
  nav { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;
        border-bottom:1px solid var(--line); }
  nav button { padding:8px 14px 10px; background:transparent; border:none;
               border-radius:6px 6px 0 0; color:var(--dim); font-size:13.5px;
               transition:color .15s, background .15s, box-shadow .15s; }
  nav button:hover { color:var(--txt); background:rgba(255,255,255,.03);
                     box-shadow:none; }
  nav button.on { color:var(--acc); box-shadow:inset 0 -2px 0 var(--acc); }

  /* ---- 按钮三级：primary(.go) / secondary(默认) / 语义 ---- */
  button { background:transparent; color:var(--txt); border:1px solid var(--line);
           border-radius:6px; padding:6px 14px; cursor:pointer; font-size:13px;
           transition:border-color .15s, color .15s, background .15s, box-shadow .15s; }
  button:hover { border-color:#4a5058; background:rgba(255,255,255,.04); }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.5; cursor:not-allowed; transform:none; }
  .go { background:linear-gradient(180deg,#3773f0,#2c5fd0); color:#fff; border:1px solid #2c5fd0;
        padding:9px 22px; font-size:14px; margin-top:14px; font-weight:500;
        box-shadow:0 2px 8px rgba(79,156,249,.25); }
  .go:hover { background:linear-gradient(180deg,#4a82f5,#3773f0); border-color:#4a82f5;
              box-shadow:0 3px 12px rgba(79,156,249,.4); }
  button.ok { color:var(--ok); border-color:rgba(63,185,111,.45); }
  button.ok:hover { border-color:var(--ok); background:rgba(63,185,111,.08); box-shadow:none; }
  button.no { color:var(--bad); border-color:rgba(224,85,85,.45); }
  button.no:hover { border-color:var(--bad); background:rgba(224,85,85,.08); box-shadow:none; }

  /* ---- 面板与表单 ---- */
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px;
           padding:14px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  label { display:block; font-size:12px; color:var(--dim); margin:10px 0 4px; }
  input[type=text], textarea, select {
    width:100%; background:#191b1e; color:var(--txt); border:1px solid var(--line);
    border-radius:6px; padding:8px 10px; font-size:14px;
    transition:border-color .15s, box-shadow .15s; }
  input[type=text]:focus, textarea:focus, select:focus {
    outline:none; border-color:var(--acc); box-shadow:0 0 0 2px rgba(79,156,249,.18); }
  select { cursor:pointer; }
  select option { background:#1e2023; color:var(--txt); }
  textarea { resize:vertical; min-height:56px; }
  .desc { background:#191b1e; border-left:2px solid var(--acc); border-radius:0 6px 6px 0;
          padding:6px 10px; font-size:12px; color:var(--dim); margin-top:4px;
          min-height:1em; display:none; }
  .desc.show { display:block; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:140px; }

  /* ---- 约束轴 chips ---- */
  .axis { margin-top:8px; }
  .axis .opts { display:flex; gap:6px; flex-wrap:wrap; }
  .axis .opt { background:#22252a; border:1px solid var(--line); border-radius:14px;
               padding:4px 12px; cursor:pointer; font-size:13px; user-select:none;
               transition:border-color .15s, background .15s, color .15s; }
  .axis .opt:hover { border-color:#4a5058; }
  .axis .opt.on { background:rgba(79,156,249,.14); border-color:var(--acc); color:var(--acc); }
  .axis .opt .src { font-size:10px; margin-left:4px; }
  .src-distilled { color:var(--gold); }
  .src-project { color:var(--ok); }
  .src-base { color:var(--dim); }
  .axis .opt .zh { display:block; font-size:10px; color:var(--dim); }

  /* ---- 任务卡 / 时间线 / 候选网格 ---- */
  .job { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px;
         background:#22252a; transition:border-color .15s; }
  .job:hover { border-color:#3a3f45; }
  .job .meta { color:var(--dim); font-size:12px; }
  .st-queued { color:var(--dim); } .st-running { color:var(--acc); }
  .st-done { color:var(--ok); } .st-error { color:var(--bad); }
  .ev { border-left:2px solid var(--line); padding:6px 12px; margin-bottom:8px;
        transition:border-color .15s; }
  .ev:hover { border-left-color:#4a5058; }
  .ev .who { color:var(--acc); font-size:13px; }
  .ev .what { font-size:13px; }
  .ev .when { color:var(--dim); font-size:11px; }
  .ev .det { color:var(--dim); font-size:12px; word-break:break-all; }
  .ev img { max-width:160px; border-radius:4px; margin-top:4px; display:block; }
  .lin { font-size:13px; }
  .lin .node { padding:4px 10px; border:1px solid var(--line); border-radius:6px;
               display:inline-block; margin:3px 4px; }
  .lin .cur { border-color:var(--acc); color:var(--acc); }
  .empty { color:var(--dim); padding:30px; text-align:center; }
  .idbox { font-size:12px; color:var(--dim); margin-top:10px; }
  .idbox input { width:auto; display:inline-block; }
  .lgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; margin-top:6px; }
  .lcard { background:#22252a; border:1px solid var(--line); border-radius:8px; overflow:hidden;
           transition:border-color .15s, box-shadow .15s; }
  .lcard:hover { border-color:#3a3f45; box-shadow:0 4px 14px rgba(0,0,0,.35); }
  .lcard img { width:100%; display:block; cursor:zoom-in; transition:filter .15s; }
  .lcard img:hover { filter:brightness(1.06); }
  .lbar { display:flex; align-items:center; gap:6px; padding:6px 8px; font-size:12px; }
  .lst-accepted { color:var(--ok); } .lst-rejected { color:var(--bad); }
  .lst-generated { color:var(--dim); } .lst-gated { color:var(--ok); }
</style>
</head>
<body>
<h1>artcreate · 工作台</h1>
<div class="sub">表单生成 · 任务队列 · 操作时间线（多端同步）</div>

<nav style="display:flex;flex-direction:column;gap:4px;margin-bottom:14px">
  <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
    <span style="color:var(--dim);font-size:11px;min-width:60px">生成资产</span>
    <button id="nav-new" class="on" onclick="show('new')">场景 / 静物</button>
    <button id="nav-pose" onclick="show('pose')">角色 / 怪物</button>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
    <span style="color:var(--dim);font-size:11px;min-width:60px">审校管理</span>
    <button id="nav-jobs" onclick="show('jobs')">任务队列</button>
    <button id="nav-feed" onclick="show('feed')">历史任务</button>
    <button id="nav-prop" onclick="show('prop')">画风回写<span id="prop-badge" style="display:none;background:var(--gold);color:#141517;border-radius:8px;font-size:10px;padding:0 5px;margin-left:3px">0</span></button>
    <button id="nav-review" onclick="show('review')">评审视图</button>
  </div>
</nav>

<div id="page-new" class="panel" style="display:none">
  <div class="row">
    <div><label>资产名（库内组织 + 拍板发布，一名两用）</label><input type="text" id="f-aname" placeholder="例：shrine_forest" oninput="previewName()"></div>
    <div style="max-width:180px"><label>后缀</label><select id="f-asuffix" onchange="previewName()"></select><div class="desc" id="desc-f-asuffix"></div></div>
  </div>
  <div style="font-size:12px;color:var(--ok);margin:4px 0 8px;min-height:1em" id="aname-preview"></div>
  <div class="row">
    <div><label>描述（中文一句话）</label><input type="text" id="f-desc" placeholder="例：森林深处一座废弃石祠，晨雾缭绕"></div>
  </div>
  <div class="row">
    <div><label>资产类型</label><select id="f-atype" onchange="showDesc(this)"></select><div class="desc" id="desc-f-atype"></div></div>
    <div><label>画风</label><select id="f-style" onchange="showDesc(this)"></select><div class="desc" id="desc-f-style"></div></div>
  </div>
  <div class="row">
    <div><label>氛围</label><select id="f-mood" onchange="showDesc(this)"></select><div class="desc" id="desc-f-mood"></div></div>
    <div><label>尺寸</label><select id="f-size"></select></div>
    <div><label>数量 <span style="font-size:11px;color:var(--dim)">每 1 张图成本≈0.2 元</span></label><select id="f-count"></select></div>
  </div>
  <label>约束轴</label>
  <div id="f-axes"></div>
  <div class="row" style="margin-top:10px">
    <div><label>正向自由约束（描述"应该是什么"）</label>
      <textarea id="f-free" placeholder="例：画面重心偏左，右侧留白"></textarea></div>
    <div><label>负向自由约束（不要出现什么）</label>
      <textarea id="f-fneg" placeholder="例：蜘蛛、篝火"></textarea></div>
  </div>
  <div id="form-extra" style="display:none;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)">
    <label style="color:var(--acc)">迭代来源</label>
    <div style="font-size:12px;color:var(--dim)" id="form-parent-info"></div>
    <button onclick="clearParent()" style="margin-top:6px">清除迭代关系（作为全新资产）</button>
  </div>
  <div style="display:flex;gap:8px;align-items:center;margin-top:14px">
    <button class="go" onclick="submitJob()">提交生成任务</button>
    <button onclick="toggleHistoryPanel()">从历史载入迭代…</button>
  </div>
  <div id="history-panel" style="display:none;margin-top:10px;border:1px solid var(--line);border-radius:6px;padding:10px">
    <div style="font-size:12px;color:var(--dim);margin-bottom:8px">点选一个历史 run 载入（最近 30 条）</div>
    <div id="history-list" style="max-height:260px;overflow-y:auto">加载中…</div>
  </div>
  <div class="idbox">身份：<input type="text" id="f-me" placeholder="你的名字（跨设备看是谁操作）" oninput="saveMe()"> <span id="f-me-id"></span></div>
</div>

<div id="review-card" class="panel" style="display:none;margin-top:14px;border-color:var(--warn)">
  <div style="font-weight:500;color:var(--warn);margin-bottom:6px">编译审核（确认前不产生生图费用）</div>
  <div id="review-explain"></div>
  <div id="review-lint"></div>
  <details style="margin-top:8px" open><summary style="cursor:pointer;color:var(--dim);font-size:12px">完整 prompt（将直送生图模型）</summary>
    <div style="background:#191b1e;border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:6px">
      <div id="review-prompt-zh" style="font-size:12px;color:var(--txt);line-height:1.7"></div>
      <div id="review-prompt" style="font-size:11px;color:var(--dim);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);word-break:break-all"></div>
    </div></details>

  <!-- 精修模式：改中文段 → 英文段同步重译 → 重组直送（2026-08-26 方案1+同步翻译） -->
  <div id="refine-zone" style="display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="color:var(--acc);font-size:13px;font-weight:600">精修模式</span>
      <!-- 双模式切换：整段=对完整中文直接改（默认，不猜模板映射）/ 分段=精准改一处 -->
      <span class="axis">
        <span class="opt on" id="rmode-full" onclick="setRefineMode('full')">整段直改</span>
        <span class="opt" id="rmode-seg" onclick="setRefineMode('seg')" style="margin-left:4px">分段精修</span>
      </span>
    </div>

    <!-- 分段视图 -->
    <div id="refine-seg-view" style="display:none">
      <div style="color:var(--dim);font-size:11px;margin-bottom:6px">改下面的中文 → 点「同步翻译」→ 被改段的英文自动重译 → 重组完整 prompt</div>
      <div id="refine-segs"></div>
    </div>

    <!-- 整段直改视图：对着完整中文 prompt 改，不关心模板约束→英文的映射 -->
    <div id="refine-full-view">
      <div style="color:var(--dim);font-size:11px;margin-bottom:6px">直接改完整中文 prompt（含画风/氛围/排除句的中文译文）→ 点「同步翻译」→ 只重译你改的部分，未改部分英文原样保留</div>
      <textarea id="refine-full-zh" style="min-height:110px;font-size:13px;line-height:1.7" oninput="markFullDirty()"></textarea>
    </div>

    <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
      <button class="go" style="margin-top:0" onclick="doRetranslate()" id="refine-sync-btn">同步翻译</button>
      <span id="refine-status" style="font-size:11px;color:var(--dim)"></span>
    </div>
    <div style="font-size:12px;color:var(--dim);margin:10px 0 4px">重组后完整 prompt（确认生成 = 按此直送）</div>
    <div id="refine-final" style="background:#191b1e;border:1px solid var(--acc);border-radius:6px;padding:8px 10px;font-size:11px;word-break:break-all;color:var(--txt)"></div>
  </div>

  <!-- 迭代载入后：沿用历史编译词（精修底稿 = 上次编译，改中文同步英文） -->
  <div id="reuse-zone" style="display:none;margin-top:8px;padding:8px 10px;border:1px dashed var(--warn);border-radius:6px">
    <div class="rz-hint" style="font-size:12px;color:var(--warn)">已携带历史编译词（迭代载入）</div>
    <div class="rz-btns" style="display:flex;gap:8px;margin-top:6px">
      <button class="go" style="margin-top:0" onclick="useLoadedCompile()">沿用上次编译（可精修）</button>
      <button onclick="discardLoadedCompile()">用新编译（忽略历史）</button>
    </div>
  </div>

  <div style="display:flex;gap:8px;align-items:center;margin-top:12px">
    <button class="go" onclick="confirmCompile()">确认生成（按此编译执行）</button>
    <button onclick="closeReview()">回去修改</button>
    <button id="refine-toggle" onclick="toggleRefine()">精修模式…</button>
  </div>
</div>

<div id="live-zone" class="panel" style="display:none;margin-top:14px">
  <div id="live-status" class="meta"></div>
  <div id="live-grid"></div>
</div>

<div id="page-pose" class="panel" style="display:none">
  <div class="row">
    <div><label>角色名（须已有锚点）</label><input type="text" id="pose-char" placeholder="例：alice"></div>
    <div><label>每动作候选数</label><select id="pose-count">
      <option>2</option><option selected>4</option><option>6</option><option>8</option>
    </select></div>
  </div>
  <div><label>角色描述（可选）</label><input type="text" id="pose-desc" placeholder="例：红发精灵弓箭手"></div>
  <label>动作选择</label>
  <div id="pose-list"></div>
  <div class="desc" id="pose-desc-box" style="margin-top:8px"></div>
  <button class="go" onclick="submitPoses()">提交动作批量任务</button>
</div>

<div id="page-jobs" class="panel" style="display:none">
  <div id="jobs-list">加载中…</div>
</div>

<div id="page-feed" class="panel" style="display:none">
  <div class="row" style="margin-bottom:10px">
    <div><label>筛选动作</label><select id="ev-action" onchange="loadFeed()">
      <option value="">全部</option></select></div>
    <div><label>筛选人</label><select id="ev-actor" onchange="loadFeed()">
      <option value="">全部</option></select></div>
  </div>
  <div id="feed"></div>
  <button onclick="loadFeed()">刷新</button>
</div>

<div id="page-prop" class="panel" style="display:none">
  <div style="display:flex;gap:8px;margin-bottom:10px">
    <button onclick="loadProp('pending')" id="pbtn-pending">待定</button>
    <button onclick="loadProp('promoted')" id="pbtn-promoted">已晋升</button>
    <button onclick="loadProp('rejected')" id="pbtn-rejected">已驳回</button>
    <span class="spacer" style="flex:1"></span>
    <button onclick="runDistill()">立即蒸馏一轮</button>
  </div>
  <div id="prop-list">加载中…</div>
</div>

<div id="page-review" class="panel" style="display:none;padding:0;overflow:hidden">
  <!-- 页内嵌入评审视图：postMessage 联动（ac-select-run 进 / ac-iterate 回），不再整页跳转 -->
  <iframe id="review-frame" src="/" style="width:100%;height:78vh;border:none;display:block"></iframe>
</div>

<div id="page-lineage" style="display:none"></div>

<script>
let DICT = null;
let axisSel = {};
let pollTimer = null;

// ---- 轻量身份 ----
// ---- toast 通知（替代浏览器 alert：右上角三态通知，自动消失，不打断操作）----
let _toastTimer = null;
function toast(msg, kind) {   // kind: 'ok' | 'bad' | 'info'（默认）
  let box = document.getElementById('toast-box');
  if (!box) {
    box = document.createElement('div');
    box.id = 'toast-box';
    box.style.cssText = 'position:fixed;top:16px;right:16px;z-index:9999;max-width:420px;'
      + 'padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5;'
      + 'box-shadow:0 4px 16px rgba(0,0,0,.5);transition:opacity .3s;opacity:0';
    document.body.appendChild(box);
  }
  const color = kind === 'ok' ? '#3fb96f' : kind === 'bad' ? '#e05555' : '#4f9cf9';
  const border = kind === 'ok' ? 'rgba(63,185,111,.5)' : kind === 'bad' ? 'rgba(224,85,85,.5)' : 'rgba(79,156,249,.5)';
  box.style.background = '#1e2023';
  box.style.border = `1px solid ${border}`;
  box.style.borderLeft = `3px solid ${color}`;
  box.style.color = '#d8dad9';
  box.textContent = msg;
  box.style.opacity = '1';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { box.style.opacity = '0'; }, 3500);
}
function meId() {
  let v = localStorage.getItem('ac-uuid');
  if (!v) {
    v = 'u-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('ac-uuid', v);
  }
  return v;
}
function meName() { return localStorage.getItem('ac-name') || ''; }
function saveMe() { localStorage.setItem('ac-name', document.getElementById('f-me').value); }
document.getElementById('f-me').value = meName();
document.getElementById('f-me-id').textContent = meId();
function actorHeaders() {
  const h = { 'X-Actor-Id': meId() };
  if (meName()) h['X-Actor-Name'] = meName();
  return h;
}
// 令牌（若服务端配置了 WORKBENCH_TOKEN，首次访问用 ?token=xxx 进入后记住）
const qs = new URLSearchParams(location.search);
if (qs.get('token')) localStorage.setItem('ac-token', qs.get('token'));
function tok() { const t = localStorage.getItem('ac-token'); return t ? {'X-Token': t} : {}; }
function H() { return { ...actorHeaders(), ...tok() }; }

// ---- 页面切换 ----
function show(p) {
  for (const x of ['new', 'pose', 'jobs', 'feed', 'prop', 'review']) {
    const pg = document.getElementById('page-' + x);
    if (pg) pg.style.display = x === p ? '' : 'none';
    document.getElementById('nav-' + x).classList.toggle('on', x === p);
  }
  if (p === 'jobs') loadJobs(true);
  if (p === 'feed') loadFeed();
  if (p === 'prop') loadProp('pending');
  if (p === 'pose') loadPoseDict();
}

// ---- 提案（D22 蒸馏晋升） ----
let propFilter = 'pending';
async function loadProp(status) {
  propFilter = status || propFilter;
  ['pending','promoted','rejected'].forEach(s =>
    document.getElementById('pbtn-' + s).classList.toggle('on', s === propFilter));
  const ps = await (await fetch('/api/proposals?status=' + propFilter, {headers: H()})).json();
  // 徽标：待定数
  const pend = await (await fetch('/api/proposals?status=pending', {headers: H()})).json();
  const badge = document.getElementById('prop-badge');
  badge.style.display = pend.length ? '' : 'none';
  badge.textContent = pend.length;

  const el = document.getElementById('prop-list');
  el.innerHTML = ps.map(p => `
    <div class="job">
      <div><b>${p.axis_id}</b> ← “${p.sample_text}” <span class="meta">×${p.count} 次</span></div>
      ${p.option_draft ? `<div style="font-size:13px;margin-top:4px">
        新选项 <code>${p.option_draft.id}</code>「${p.option_draft.label}」
        · 正向：${(p.option_draft.positive||[]).join(', ')||'—'}
        · 负向：${(p.option_draft.negative||[]).join(', ')||'—'}</div>
        <div class="meta">验图问句：${p.option_draft.verify_question||'—'}</div>` : ''}
      <div class="meta">置信 ${((p.confidence||0)*100).toFixed(0)}% · ${p.reason||''}
        ${p.decided_by ? ` · 由 ${p.decided_by} ${p.status==='promoted'?'晋升':'驳回'}` : ''}</div>
      <div style="margin-top:6px">
        ${p.status==='pending' ? `
          <button class="ok" onclick="actProp(${p.id},'approve')">晋升</button>
          <button class="no" onclick="actProp(${p.id},'reject')">驳回</button>` : ''}
        ${p.status==='promoted' ? `<button onclick="actProp(${p.id},'undo')">撤销晋升</button>` : ''}
        ${p.status==='rejected' ? `<button onclick="actProp(${p.id},'undo-reject')">恢复提案</button>` : ''}
      </div>
    </div>`).join('') || '<div class="empty">暂无' + (propFilter==='pending'?'提案（蒸馏会自动产出，也可手动触发）':'记录') + '</div>';
}
async function actProp(pid, kind) {
  if (kind === 'reject' && !confirm('驳回该提案？')) return;
  if (kind === 'approve' && !confirm('晋升为新选项？全部用户表单将出现该选项，且写入 derived 版本库')) return;
  const r = await fetch(`/api/proposals/${pid}/${kind}`, {method:'POST', headers:H()});
  const d = await r.json();
  if (r.status !== 200) { toast('失败：' + JSON.stringify(d.detail || d), 'bad'); return; }
  if (d.git_commit) toast('已提交版本库 ' + d.git_commit, 'ok');
  loadProp(propFilter);
  loadDict();  // 字典可能已变（晋升后表单刷新）
}
async function runDistill() {
  const r = await fetch('/api/distill/run', {method:'POST', headers:H()});
  const d = await r.json();
  toast(r.status === 200
    ? `蒸馏完成：采样 ${d.harvested} · LLM 判定 ${d.judged} · 新提案 ${d.new_proposals}`
    : '失败：' + JSON.stringify(d.detail || d),
    r.status === 200 ? 'ok' : 'bad');
  loadProp('pending');
}

  fill('f-mood', DICT.moods, 'label');

function fill(id, dict, labelf) {
  const el = document.getElementById(id);

    el.insertAdjacentHTML('beforeend', `<option value="${k}">${v[labelf] || k}</option>`);

// ---- 资产命名预览 ----
function previewName() {
  const name = document.getElementById('f-aname').value.trim();
  const skey = document.getElementById('f-asuffix').value;
  const box = document.getElementById('aname-preview');

function pickAxis(el) {
  const axis = el.dataset.axis;
  document.querySelectorAll(`.opt[data-axis="${axis}"]`).forEach(x => x.classList.remove('on'));
  el.classList.add('on');
  axisSel[axis] = el.dataset.opt;
  // 中文对照条：显示该选项注入/排除词的翻译（消除编译信息差）
  const ax = (DICT.constraint_axes || []).find(a => a.id === axis);
  const box = document.getElementById('axis-zh-' + axis);
  if (!ax || !box) return;
  const opt = ax.options.find(o => o.id === el.dataset.opt);
  if (!opt || opt.id === 'any') { box.classList.remove('show'); return; }
  const zh = opt.zh || {};
  const pos = (zh.positive || []).join('、');
  const neg = (zh.negative || []).join('、');
  box.innerHTML = `<b>${opt.label}</b> → ` +
    (pos ? `注入：<span style="color:var(--ok)">${pos}</span>` : '') +
    (neg ? `${pos ? ' ∣ ' : ''}排除：<span style="color:var(--bad)">${neg}</span>` : '') +
    (opt.verify_question ? `<div style="margin-top:2px;color:var(--dim)">验图问句：${opt.verify_question}</div>` : '');
  box.classList.add('show');
}

// ---- 提交（资产名一名两用：subject + 发布名）----
let parentRun = null;   // 迭代来源 run
let pendingSpec = null; // 审核卡挂起的 spec（确认后入队）
let loadedCompile = null; // 历史载入携带的编译词（prompt/segments/prompt_zh）——精修底稿
function clearParent() {
  parentRun = null;
  document.getElementById('form-extra').style.display = 'none';
}
function collectSpec() {
  const aname = document.getElementById('f-aname').value.trim();
  if (!aname) { toast('资产名必填（库内组织 + 拍板发布一名两用）', 'bad'); return null; }
  const spec = {
    subject: aname,
    asset_name: aname,
    asset_suffix_key: document.getElementById('f-asuffix').value || 'none',
    description: document.getElementById('f-desc').value.trim(),
    asset_type: document.getElementById('f-atype').value,
    art_style: document.getElementById('f-style').value,
    mood: document.getElementById('f-mood').value,
    size: document.getElementById('f-size').value,
    count: parseInt(document.getElementById('f-count').value),
    constraints: {
      axis_sel: axisSel,
      free_text: document.getElementById('f-free').value.trim(),
      free_text_negative: document.getElementById('f-fneg').value.trim(),
    },
  };
  if (parentRun) spec.parent_run = parentRun;
  if (!spec.description) { toast('描述必填', 'bad'); return null; }
  return spec;
}
async function submitJob() {
  const spec = collectSpec();
  if (!spec) return;
  // 历史载入且带编译词：跳过重编译（LLM 有随机性，历史词才是所见即所得），
  // 直达审核卡 + 按需补译中文底稿 → 精修
  if (loadedCompile && loadedCompile.prompt) {
    pendingSpec = spec;
    pendingSpec.compiled_prompt = loadedCompile.prompt;
    if (loadedCompile.segments) pendingSpec.compiled_segments = loadedCompile.segments;
    pendingSpec.compiled_prompt_zh = '';
    pendingSpec.prompt_reused = true;
    const d = { prompt: loadedCompile.prompt,
                segments: pendingSpec.compiled_segments,
                explain: [], lint: [], spec_issues: [] };
    try {
      const resp = await fetch('/api/translate-prompt', {
        method: 'POST', headers: {'Content-Type': 'application/json', ...H()},
        body: JSON.stringify({ prompt: loadedCompile.prompt }),
      });
      if (resp.ok) {
        const t = await resp.json();
        pendingSpec.compiled_prompt_zh = t.zh || '';
        d.prompt_zh = pendingSpec.compiled_prompt_zh;
      }
    } catch (e) { /* 补译失败不阻断：精修降级分段模式 */ }
    renderReviewCard(d);
    // 直达态的 reuse-zone：改成了"逃生口"——历史词已生效，若改过表单想要全新编译从这里走
    const rz = document.getElementById('reuse-zone');
    rz.style.display = '';
    rz.querySelector('.rz-hint').textContent = '已沿用历史编译词（上方 prompt / 精修区底稿）';
    rz.querySelectorAll('button').forEach(b => b.style.display = 'none');
    const esc = rz.querySelector('#rz-recompile') || (() => {
      const btn = document.createElement('button');
      btn.id = 'rz-recompile';
      btn.textContent = '用新编译（按当前表单重编）';
      btn.onclick = () => discardAndRecompile();
      rz.querySelector('.rz-btns').appendChild(btn);
      return btn;
    })();
    esc.style.display = '';
    // 自动展开精修模式（从历史/精修按钮进来，目的就是改历史编译词）。
    // 模式交给 buildRefineFull 内部判断：中文底稿在（补译成功）→ full；缺失 → 降级 seg
    if (!refineOn) { refineMode = 'full'; toggleRefine(); }
    else { buildRefineSegs(); refineMode = 'full'; buildRefineFull(); }
    document.getElementById('refine-zone').scrollIntoView({behavior:'smooth', block:'nearest'});
    toast('已载入历史编译词，直接改中文即可（确认生成按此直送）', 'ok');
    return;
  }
  // 位置A：先同步编译 → 审核卡（中英对照+lint）→ 确认才入队
  const btn = document.querySelector('#page-new .go');
  btn.textContent = '编译中…';
  btn.disabled = true;
  try {
    const r = await fetch('/api/compile-preview', {
      method: 'POST', headers: {'Content-Type': 'application/json', ...H()},
      body: JSON.stringify(spec)});
    const d = await r.json();
    if (r.status !== 200) {
      toast('spec 校验未通过：' + (d.detail?.message || JSON.stringify(d.detail || d)), 'bad');
      return;
    }
    pendingSpec = spec;
    pendingSpec.compiled_prompt = d.prompt;
    pendingSpec.compiled_segments = d.segments;
    pendingSpec.compiled_prompt_zh = d.prompt_zh || '';   // 整段直改模式的中文底稿
    renderReviewCard(d);
  } catch (e) {
    toast('编译预览失败：' + e, 'bad');
  } finally {
    btn.textContent = '提交生成任务';
    btn.disabled = false;
  }
}
function renderReviewCard(d) {
  document.getElementById('review-explain').innerHTML = (d.explain || []).map(s => `
    <div style="margin-bottom:6px">
      <span style="color:var(--acc);font-size:12px">【${s.section}】</span>
      <span style="font-size:12px">${s.zh}</span>
      <div style="color:var(--dim);font-size:11px;word-break:break-all">${s.en}</div>
    </div>`).join('');
  const lints = [...(d.lint || []), ...(d.spec_issues || [])];
  document.getElementById('review-lint').innerHTML = lints.length
    ? lints.map(w => `<div style="font-size:12px;color:${w.level === 'block' ? 'var(--bad)' : 'var(--warn)'}">${w.level === 'block' ? '⛔' : '⚠️'} ${w.message}${w.fix ? `<div style="color:var(--dim);font-size:11px">建议：${w.fix}</div>` : ''}</div>`).join('')
    : '<div style="font-size:12px;color:var(--ok)">✓ lint 全部通过</div>';
  document.getElementById('review-prompt').textContent = d.prompt;
  document.getElementById('review-prompt-zh').textContent =
    d.prompt_zh || '（中文翻译暂不可用，上方分段对照仍可核对）';
  // 历史载入的迭代（尚未提交，等用户选沿用/新编）：提供"沿用上次编译"入口
  const rz = document.getElementById('reuse-zone');
  rz.style.display = (loadedCompile && loadedCompile.prompt) ? '' : 'none';
  rz.querySelector('.rz-hint').textContent = '已携带历史编译词（迭代载入）';
  rz.querySelectorAll('.rz-btns button').forEach(b => b.style.display = '');
  const escBtn = document.getElementById('rz-recompile');
  if (escBtn) escBtn.style.display = 'none';   // 逃生口只在直达态显示
  const card = document.getElementById('review-card');
  card.style.display = '';
  card.scrollIntoView({behavior: 'smooth'});
}
function closeReview() {
  document.getElementById('review-card').style.display = 'none';
  pendingSpec = null;
  loadedCompile = null;   // 关卡即弃：下次重编或重载
  refineOn = false;
  refineMode = 'full';    // 重置默认：整段直改
  document.getElementById('refine-zone').style.display = 'none';
  document.getElementById('refine-toggle').textContent = '精修模式…';
  document.getElementById('reuse-zone').style.display = 'none';
}

// ---- 精修模式：分段编辑 + 同步重译 + 重组（2026-08-26 方案1）----
// 可编辑段定义：key 对应 compiler segments 键；has_zh=有中文原文（用户输入），
// 否则给"中文重述"框（LLM 编译段无中文源）。字典段（画风/prefix/氛围注入）不开放。
let refineOn = false;
const REFINE_KEYS = [
  { key: 'scene_core_en',      label: '主体描述', has_zh: true },
  { key: 'scene_expansion',    label: '扩写元素', has_zh: false },
  { key: 'atmosphere_notes',   label: '氛围注记', has_zh: false },
  { key: 'free_constraints_en',label: '正向约束', has_zh: true },
  { key: 'free_negative_en',   label: '负向排除', has_zh: true, neg: true },
];
let refineSegs = {};   // key -> {zh, en, orig_en, orig_zh}
let refineMode = 'full';       // 默认整段直改（用户不需懂模板映射）
let refineFull = { orig_zh: '', orig_en: '', dirty: false };   // 整段模式状态
function toggleRefine() {
  refineOn = !refineOn;
  const zone = document.getElementById('refine-zone');
  const btn = document.getElementById('refine-toggle');
  zone.style.display = refineOn ? '' : 'none';
  btn.textContent = refineOn ? '收起精修' : '精修模式…';
  if (refineOn) {
    buildRefineSegs();
    buildRefineFull();
    setRefineMode(refineMode);   // 应用当前模式（含视图显示与 chip 高亮）
  }
}
function setRefineMode(m) {
  refineMode = m;
  document.getElementById('rmode-full').classList.toggle('on', m === 'full');
  document.getElementById('rmode-seg').classList.toggle('on', m === 'seg');
  document.getElementById('refine-full-view').style.display = m === 'full' ? '' : 'none';
  document.getElementById('refine-seg-view').style.display = m === 'seg' ? '' : 'none';
}
function buildRefineFull() {
  // 整段直改底稿：编译返回的完整中文翻译 + 对应英文原文。
  // 中文底稿缺失（历史沿用+补译失败）时降级分段模式，避免空文本框。
  refineFull.orig_zh = (pendingSpec && pendingSpec.compiled_prompt_zh) || '';
  refineFull.orig_en = (pendingSpec && pendingSpec.compiled_prompt) || '';
  refineFull.dirty = false;
  const ta = document.getElementById('refine-full-zh');
  ta.value = refineFull.orig_zh;
  if (!refineFull.orig_zh && refineFull.orig_en) {
    setRefineMode('seg');
    document.getElementById('refine-status').textContent =
      '无中文底稿（历史编译补译失败），已切分段精修';
  } else {
    renderRefineFinal();
  }
}
function markFullDirty() { refineFull.dirty = true; }
function buildRefineSegs() {
  const segs = (pendingSpec && pendingSpec.compiled_segments) || {};
  const cons = (pendingSpec && pendingSpec.constraints) || {};
  // 中文原文源：用户表单输入（描述/自由约束/负向约束）
  const zhSource = {
    scene_core_en: pendingSpec ? pendingSpec.description : '',
    free_constraints_en: cons.free_text || '',
    free_negative_en: (cons.free_text_negative || '').replace(/^不要出现?/, '').replace(/^不要/, ''),
  };
  refineSegs = {};
  const box = document.getElementById('refine-segs');
  box.innerHTML = REFINE_KEYS.map(r => {
    const en = segs[r.key] || '';
    if (!en && !(Array.isArray(segs[r.key]))) { /* 空段也显示，可填入新内容 */ }
    const zh = zhSource[r.key] || '';
    refineSegs[r.key] = { zh, en: r.neg ? String(segs.free_negative_en || '') : String(en),
                          orig_en: String(en), orig_zh: zh, neg: !!r.neg };
    const ph = r.has_zh ? '改这里的中文名词/描述' : '用中文重述你想要的元素（选填，留空=保留原段）';
    return `
    <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px">
      <span style="min-width:64px;color:var(--dim);font-size:12px;padding-top:7px">${r.label}</span>
      <div style="flex:1">
        <input type="text" id="rz-${r.key}" value="${zh.replace(/"/g, '&quot;')}"
               placeholder="${ph}" style="font-size:13px;padding:5px 8px"
               oninput="refineSegs['${r.key}'].zh = this.value">
        <div id="re-${r.key}" style="font-size:11px;color:${r.neg ? 'var(--bad)' : 'var(--ok)'};margin-top:2px;word-break:break-all">
          ${r.neg ? 'Strictly avoid: ' : ''}${r.neg ? String(segs.free_negative_en || '') : en || '（空段，填中文后同步可生成）'}
        </div>
      </div>
    </div>`;
  }).join('');
  renderRefineFinal();
}
async function doRetranslate() {
  if (refineMode === 'full') return doRetranslateFull();
  // 收集被改段（zh 与原 zh 不同，或无中文源但填了重述）
  const items = [];
  for (const r of REFINE_KEYS) {
    const s = refineSegs[r.key];
    if (!s) continue;
    const changed = r.has_zh ? (s.zh && s.zh !== s.orig_zh)
                             : (s.zh && s.zh.trim());   // 重述段：填了就算
    if (changed) items.push({ key: r.key, zh: s.zh });
  }
  if (!items.length) {
    document.getElementById('refine-status').textContent = '没有检测到修改（改上面分段的中文字段）';
    return;
  }
  const btn = document.getElementById('refine-sync-btn');
  btn.disabled = true; btn.textContent = '重译中…';
  document.getElementById('refine-status').textContent = '';
  try {
    const resp = await fetch('/api/retranslate', {
      method: 'POST', headers: {'Content-Type': 'application/json', ...H()},
      body: JSON.stringify({ items }),
    });
    const d = await resp.json();
    if (resp.status !== 200) {
      document.getElementById('refine-status').textContent =
        '重译失败：' + (d.detail || JSON.stringify(d));
      return;
    }
    for (const [key, en] of Object.entries(d.translations || {})) {
      if (!refineSegs[key]) continue;
      refineSegs[key].en = en;
      const line = document.getElementById('re-' + key);
      if (line) line.textContent = (refineSegs[key].neg ? 'Strictly avoid: ' : '') + en;
    }
    renderRefineFinal();
    document.getElementById('refine-status').textContent =
      `已同步 ${Object.keys(d.translations || {}).length} 段（未改段保持原样）`;
  } catch (e) {
    document.getElementById('refine-status').textContent = '重译失败：' + e;
  } finally {
    btn.disabled = false; btn.textContent = '同步翻译';
  }
}
async function doRetranslateFull() {
  // 整段直改：三元组对齐重译（改了的部分重译，未改部分抄原英文）
  const edited_zh = document.getElementById('refine-full-zh').value.trim();
  if (!edited_zh) {
    document.getElementById('refine-status').textContent = '中文 prompt 为空';
    return;
  }
  if (edited_zh === refineFull.orig_zh) {
    document.getElementById('refine-status').textContent = '没有检测到修改（直接改上方中文全文）';
    return;
  }
  const btn = document.getElementById('refine-sync-btn');
  btn.disabled = true; btn.textContent = '对齐重译中…';
  document.getElementById('refine-status').textContent = '';
  try {
    const resp = await fetch('/api/retranslate-full', {
      method: 'POST', headers: {'Content-Type': 'application/json', ...H()},
      body: JSON.stringify({ orig_zh: refineFull.orig_zh,
                             orig_en: refineFull.orig_en,
                             edited_zh }),
    });
    const d = await resp.json();
    if (resp.status !== 200) {
      document.getElementById('refine-status').textContent =
        '重译失败：' + (d.detail || JSON.stringify(d));
      return;
    }
    refineFull.orig_en = d.en;    // 结果作为新底稿（可继续改继续同步）
    refineFull.orig_zh = edited_zh;
    refineFull.dirty = false;
    renderRefineFinal();
    document.getElementById('refine-status').textContent =
      '已同步（未改部分英文原样保留）';
  } catch (e) {
    document.getElementById('refine-status').textContent = '重译失败：' + e;
  } finally {
    btn.disabled = false; btn.textContent = '同步翻译';
  }
}
function renderRefineFinal() {
  // 整段直改模式：最终英文 = 最近一次对齐结果（orig_en 随同步更新）
  if (refineMode === 'full') {
    const full = refineFull.orig_en;
    document.getElementById('refine-final').textContent = full;
    if (pendingSpec && full) {
      pendingSpec.compiled_prompt = full;
      pendingSpec.prompt_edited = true;
    }
    return;
  }
  // 分段模式：按 compiler 原拼装顺序重组：prefix → core → expansion → mood → atmosphere
  // → extra → positives → free_cons → style_suffix → 排除块句
  const segs = (pendingSpec && pendingSpec.compiled_segments) || {};
  const g = k => (refineSegs[k] && refineSegs[k].en) || segs[k] || '';
  const parts = [segs.media_prefix, g('scene_core_en'), g('scene_expansion'),
                 segs.mood_inject, g('atmosphere_notes'), segs.extra_en,
                 ...(segs.positives || []), g('free_constraints_en'),
                 segs.style_suffix]
    .map(p => String(p || '').trim().replace(/\.$/, ''))
    .filter(Boolean);
  let full = parts.join(', ');
  // 排除块重组：轴负向（negative_block 减去旧翻译词）+ 新翻译负向 + people 兜底。
  // 关键：旧 free_negative_en 的词要从轴负向里剥掉——否则用户删了"月亮"，
  // 旧翻译的 moon 仍留在块里删不掉（2026-08-26 精修回归发现）。
  const oldNeg = String(segs.free_negative_en || '').split(/[，,、]/)
    .map(x => x.trim().toLowerCase()).filter(Boolean);
  const axisNeg = (segs.negative_block || [])
    .filter(n => !oldNeg.includes(String(n).toLowerCase()));
  const newNeg = String(g('free_negative_en') || '').split(/[，,、]/)
    .map(x => x.trim()).filter(Boolean);
  const seen = new Set(); const dedup = [];
  for (const n of [...axisNeg, ...newNeg]) {
    const k = n.toLowerCase(); if (!seen.has(k)) { seen.add(k); dedup.push(n); }
  }
  if (!seen.has('people')) dedup.push('people');
  if (dedup.length) full += '. Strictly avoid: ' + dedup.join(', ') + '.';
  document.getElementById('refine-final').textContent = full;
  // 存回 pendingSpec：确认生成走 compiled_prompt 直通
  if (pendingSpec) {
    pendingSpec.compiled_prompt = full;
    pendingSpec.prompt_edited = true;
  }
}
async function useLoadedCompile() {
  // 沿用历史编译词：pendingSpec 换底稿 → 打开精修（整段底稿=历史编译的中文回译）
  if (!loadedCompile || !pendingSpec) return;
  pendingSpec.compiled_prompt = loadedCompile.prompt;
  if (loadedCompile.segments) pendingSpec.compiled_segments = loadedCompile.segments;
  pendingSpec.compiled_prompt_zh = '';
  document.getElementById('review-prompt').textContent = loadedCompile.prompt;
  // 中文底稿：历史 run 通常没存 prompt_zh，译一次（同 compile-preview 的译法）
  try {
    const resp = await fetch('/api/translate-prompt', {
      method: 'POST', headers: {'Content-Type': 'application/json', ...H()},
      body: JSON.stringify({ prompt: loadedCompile.prompt }),
    });
    if (resp.ok) {
      const d = await resp.json();
      pendingSpec.compiled_prompt_zh = d.zh || '';
    }
  } catch (e) { /* 翻译失败不阻断：精修退到分段模式 */ }
  document.getElementById('review-prompt-zh').textContent =
    pendingSpec.compiled_prompt_zh || '（历史编译的中文底稿翻译失败，可用分段精修）';
  document.getElementById('reuse-zone').style.display = 'none';
  // 重建精修底稿（pendingSpec 已换成历史编译词）并确保精修区打开
  refineMode = 'full';
  if (refineOn) { buildRefineSegs(); buildRefineFull(); setRefineMode('full'); }
  else toggleRefine();
  document.getElementById('refine-zone').scrollIntoView({behavior:'smooth', block:'nearest'});
  toast('已切到历史编译词，直接在精修模式改', 'ok');
}
function discardLoadedCompile() {
  loadedCompile = null;
  document.getElementById('reuse-zone').style.display = 'none';
  toast('将使用本次新编译', 'info');
}
async function discardAndRecompile() {
  // 直达态逃生口：弃历史编译词，按当前表单重新编译 → 正常审核卡流程
  loadedCompile = null;
  toast('弃历史编译词，按当前表单重新编译…', 'info');
  await submitJob();
}
async function confirmCompile() {
  if (!pendingSpec) return;
  const spec = pendingSpec;
  closeReview();
  const r = await fetch('/api/jobs', { method: 'POST', headers: {'Content-Type': 'application/json', ...H()}, body: JSON.stringify(spec) });
  const d = await r.json();
  if (r.status !== 200) {
    toast('入队被拦截：' + (d.detail?.message || JSON.stringify(d.detail || d)), 'bad');
    return;
  }
  trackJob(d.job_id);
}

// ---- 单页闭环：进度卡 + 就地候选网格 ----
let trackTimer = null;
function trackJob(jobId) {
  clearInterval(trackTimer);
  const zone = document.getElementById('live-zone');
  zone.style.display = '';
  trackTimer = setInterval(async () => {
    const j = await (await fetch(`/api/jobs/${jobId}`, {headers: H()})).json();
    const card = document.getElementById('live-status');
    if (j.status === 'queued') {
      card.innerHTML = `<span class="st-queued">● 排队中</span> <span class="meta">#${j.id}</span>`;
    } else if (j.status === 'running') {
      card.innerHTML = `<span class="st-running">● 生成中</span> <span class="meta">${j.progress || ''}…</span>`;
    } else {
      clearInterval(trackTimer);
      if (j.status === 'error') {
        card.innerHTML = `<span class="st-error">● 失败</span> <div class="meta" style="color:var(--bad);white-space:pre-wrap;margin-top:6px">${(j.error||'').split('\n')[0]}</div>`;
        return;
      }
      card.innerHTML = `<span class="st-done">● 完成</span> <span class="meta">run ${j.run_id}</span>`;
      loadLiveCandidates(j.run_id);
    }
  }, 2500);
  card_loop();
}
async function card_loop() { /* 兼容占位 */ }
async function loadLiveCandidates(runId) {
  const d = await (await fetch(`/api/runs/${runId}/candidates`, {headers: H()})).json();
  const grid = document.getElementById('live-grid');
  grid.innerHTML = `
    <div style="font-size:12px;color:var(--dim);margin:8px 0 6px">候选（接受/拒绝就地完成，拍板即发布 exports/final/）</div>
    <div class="lgrid">${d.candidates.map(c => `
      <div class="lcard" data-idx="${c.idx}">
        <img src="/api/images/${d.run.subject}/${runId}/${c.file}" loading="lazy" onclick="zoomLive(this.src)">
        <div class="lbar">
          <span>#${c.idx}</span><span class="lst-${c.status}">${c.status}</span>
          <span style="flex:1"></span>
          ${c.status === 'generated' || c.status === 'gated' ? `
            <button class="ok" onclick="liveAct('accept',${c.idx},this)">接受</button>
            <button class="no" onclick="liveAct('reject',${c.idx},this)">拒绝</button>
            <button onclick="refineThisRun('${runId}',this)">精修</button>` : ''}
        </div>
      </div>`).join('')}</div>`;
  grid.dataset.run = runId;
  grid.dataset.subject = d.run.subject;
}
async function liveAct(kind, idx, btn) {
  const runId = document.getElementById('live-grid').dataset.run;
  // 防重复：请求前禁用该卡全部操作按钮（点过即失效，防多次事件/多条历史记录）
  const card = btn ? btn.closest('.lcard') : null;
  if (card) card.querySelectorAll('.lbar button').forEach(b => b.disabled = true);
  try {
    if (kind === 'reject') {
      const code = prompt('拒绝码（style_drift / composition / constraint_violation / other）:', 'manual');
      if (code === null) { if (card) card.querySelectorAll('.lbar button').forEach(b => b.disabled = false); return; }
      await fetch(`/api/runs/${runId}/candidates/${idx}/reject?code=${encodeURIComponent(code)}`, {method:'POST', headers:H()});
      toast(`#${idx} 已拒绝`, 'info');
    } else {
      const r = await fetch(`/api/runs/${runId}/candidates/${idx}/accept`, {method:'POST', headers:H()});
      const d = await r.json().catch(() => ({}));
      if (d.final_name) toast(`已拍板发布：exports/final/${d.final_name}.png`, 'ok');
      else toast(`#${idx} 接受失败：` + (d.detail || '未知错误'), 'bad');
    }
  } catch (e) {
    toast('操作失败：' + e, 'bad');
    if (card) card.querySelectorAll('.lbar button').forEach(b => b.disabled = false);
    return;
  }
  loadLiveCandidates(runId);
}
async function refineThisRun(runId, btn) {
  if (btn) btn.disabled = true;
  // 候选卡精修入口：取历史 spec+编译词 → 回填表单 → 直达审核卡精修
  await fillFromRun(runId);
  document.getElementById('review-card').style.display = 'none';   // 无新编译，先藏审核卡
  await submitJob();   // 带历史编译词自动直达审核卡+精修（跳过重编译）
}
function zoomLive(src) { window.open(src, '_blank'); }

// ---- 从历史载入（迭代入口：可点选列表）----
let HIST_RUNS = null;
function toggleHistoryPanel() {
  const p = document.getElementById('history-panel');
  const open = p.style.display === 'none';
  p.style.display = open ? '' : 'none';
  if (open) loadHistoryList();
}
async function loadHistoryList() {
  HIST_RUNS = await (await fetch('/api/runs', {headers: H()})).json();
  const el = document.getElementById('history-list');
  el.innerHTML = HIST_RUNS.slice(0, 30).map((r, i) => `
    <div class="hist-item" onclick="pickHistory(${i})" style="display:flex;gap:8px;align-items:center;
      padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px"
      onmouseover="this.style.background='#22252a'" onmouseout="this.style.background=''">
      <b>${r.subject}</b>
      <span class="meta">rev${r.revision}${r.pose ? ' · 动作:' + r.pose : ''} · ${r.created_at}</span>
      <span style="flex:1"></span>
      <code style="font-size:11px;color:var(--dim)">${r.run_id.slice(-6)}</code>
    </div>`).join('') || '<div class="empty">暂无历史 run</div>';
}
async function pickHistory(i) {
  const r = HIST_RUNS[i];
  if (!r) return;
  toggleHistoryPanel();
  await fillFromRun(r.run_id, r);
  toast(`已载入 ${r.subject}（rev${r.revision}）· 点「提交生成任务」直达历史编译词精修`, 'ok');
}
async function fillFromRun(runId, meta) {
  const full = await (await fetch(`/api/spec/${runId}`, {headers: H()})).json();
  const spec = full.spec || {};
  document.getElementById('f-aname').value = spec.asset_name || spec.subject || '';
  document.getElementById('f-asuffix').value = spec.asset_suffix_key || 'none';
  document.getElementById('f-desc').value = spec.description || '';
  if (spec.asset_type) document.getElementById('f-atype').value = spec.asset_type;
  if (spec.art_style) document.getElementById('f-style').value = spec.art_style;
  if (spec.mood) document.getElementById('f-mood').value = spec.mood;
  if (spec.size) document.getElementById('f-size').value = spec.size;
  // 出图数量回填：下拉选项不存在时（如历史 spec 的 3/5）动态追加，避免静默回落 4
  if (spec.count) {
    const csel = document.getElementById('f-count');
    if (![...csel.options].some(o => o.value === String(spec.count)))
      csel.insertAdjacentHTML('beforeend', `<option>${spec.count}</option>`);
    csel.value = spec.count;
  }
  document.getElementById('f-free').value = (spec.constraints || {}).free_text || '';
  document.getElementById('f-fneg').value = (spec.constraints || {}).free_text_negative || '';
  axisSel = {};
  document.querySelectorAll('#f-axes .opt').forEach(el => el.classList.remove('on'));
  for (const [ax, opt] of Object.entries((spec.constraints || {}).axis_sel || {})) {
    const el = document.querySelector(`.opt[data-axis="${ax}"][data-opt="${opt}"]`);
    if (el) { el.classList.add('on'); axisSel[ax] = opt; }
  }
  // 历史编译词携带：进精修模式的底稿（prompt=spec 直通词 / segments=分段 /
  // prompt_zh 用翻译端点按需补齐）
  loadedCompile = {
    prompt: spec.compiled_prompt || full.prompt || '',
    segments: spec.compiled_segments || full.segments || null,
    prompt_zh: '',
  };
  parentRun = runId;
  document.getElementById('form-extra').style.display = '';
  document.getElementById('form-parent-info').textContent =
    `迭代自 run ${runId}（${meta ? meta.subject : spec.subject || ''}）——已携带历史编译词，提交后可在审核卡精修`;
  ['f-atype','f-style','f-mood'].forEach(id => showDesc(document.getElementById(id)));
  previewName();
}

// ---- 动作批量（7-B） ----
let poseSel = new Set();
let POSE_DICT = null;
async function loadPoseDict() {
  if (!DICT) DICT = await (await fetch('/api/form/dict', {headers: H()})).json();
  POSE_DICT = DICT.character_poses || {};
  const el = document.getElementById('pose-list');
  el.innerHTML = Object.entries(POSE_DICT).map(([id, p]) => `
    <span class="opt pose-chip" data-pose="${id}" onclick="togglePose(this)"
      style="background:#22252a;border:1px solid var(--line);border-radius:14px;
      padding:4px 12px;cursor:pointer;font-size:13px;display:inline-block;margin:3px">
      ${p.label}<span style="color:var(--dim);font-size:10px;margin-left:4px">${id}</span>
    </span>`).join('');
}
function togglePose(el) {
  const id = el.dataset.pose;
  if (poseSel.has(id)) { poseSel.delete(id); el.classList.remove('on'); }
  else { poseSel.add(id); el.classList.add('on'); el.style.outline = '1px solid var(--acc)'; el.style.color = 'var(--acc)'; }
  if (!poseSel.has(id)) { el.style.outline = ''; el.style.color = ''; }
  // desc
  const box = document.getElementById('pose-desc-box');
  if (poseSel.size === 1) {
    const pid = [...poseSel][0];
    const p = POSE_DICT[pid];
    box.textContent = `${p.label}：${p.desc || ''}`;
    box.classList.add('show');
  } else {
    box.classList.remove('show');
  }
}
async function submitPoses() {
  const char = document.getElementById('pose-char').value.trim();
  if (!char) { toast('角色名必填', 'bad'); return; }
  if (!poseSel.size) { toast('至少选一个动作', 'bad'); return; }
  const body = {
    poses: [...poseSel],
    count_each: parseInt(document.getElementById('pose-count').value),
    description: document.getElementById('pose-desc').value.trim(),
  };
  const r = await fetch(`/api/characters/${encodeURIComponent(char)}/pose-batch`, {
    method: 'POST', headers: {'Content-Type': 'application/json', ...H()},
    body: JSON.stringify(body),
  });
  const d = await r.json();
  if (r.status !== 200) {
    toast('提交失败：' + (d.detail || JSON.stringify(d)), 'bad');
    return;
  }
  toast(`已入队：${char} × ${body.poses.join(',')}（每动作${body.count_each}张）`, 'ok');
  show('jobs');
}

// ---- 任务 ----
async function loadJobs(auto) {
  const js = await (await fetch('/api/jobs', {headers: H()})).json();
  const el = document.getElementById('jobs-list');
  el.innerHTML = js.map(j => `
    <div class="job">
      <span class="st-${j.status}">● ${j.status}</span>
      <span class="meta">#${j.id} · ${j.actor_name || j.actor_id} · ${j.created_at}</span>
      ${j.run_id ? `<div><a href="/#run-${j.run_id}" onclick="goReview('${j.run_id}')">→ 查看候选 ${j.run_id}</a></div>` : ''}
      ${j.progress && j.status === 'running' ? `<div class="meta">${j.progress}…</div>` : ''}
      ${j.error ? `<div class="meta" style="color:var(--bad);white-space:pre-wrap">${j.error.split('\n')[0]}</div>` : ''}
    </div>`).join('') || '<div class="empty">暂无任务</div>';
  if (auto) {
    clearInterval(pollTimer);
    if (js.some(j => j.status === 'queued' || j.status === 'running'))
      pollTimer = setInterval(() => loadJobs(true), 3000);
    else clearInterval(pollTimer);
  }
}
function goReview(runId) {
  // 页内切换：评审 iframe 已载则直接 postMessage 选 run；未载则 localStorage 兜底（iframe 启动时读）
  localStorage.setItem('ac-goto-run', runId);
  show('review');
  const f = document.getElementById('review-frame');
  if (f && f.contentWindow) {
    try { f.contentWindow.postMessage({ type: 'ac-select-run', runId }, '*'); }
    catch (e) { /* iframe 未就绪，靠 localStorage 启动读取 */ }
  }
}

// 评审页（iframe 内）发起"载入迭代"：切回生成页并回填表单
window.addEventListener('message', (ev) => {
  if (ev.data && ev.data.type === 'ac-iterate' && ev.data.runId) {
    show('new');
    fillFromRun(ev.data.runId);
  }
});

// ---- 历史任务（时间线）----
async function loadFeed() {
  // 两请求两用途：evs=筛选后展示，actors=筛选项来源（修复：旧代码解构 3 变量，
  // actors undefined → .map 抛异常 → 静默失败 → 时间线永远空白）
  const [evs, actors] = await Promise.all([
    fetch(`/api/events?limit=100${document.getElementById('ev-action').value ? '&action=' + document.getElementById('ev-action').value : ''}${document.getElementById('ev-actor').value ? '&actor_id=' + document.getElementById('ev-actor').value : ''}`, {headers: H()}).then(r => r.json()),
    fetch('/api/events?limit=200', {headers: H()}).then(r => r.json()),
  ]).catch(() => [[], []]);
  // 筛选项填充（一次性）
  const actSel = document.getElementById('ev-action');
  const acts_set = [...new Set(actors.map(e => e.action))].sort();
  if (actSel.options.length <= 1) acts_set.forEach(a => actSel.insertAdjacentHTML('beforeend', `<option>${a}</option>`));
  const whoSel = document.getElementById('ev-actor');
  const who_set = [...new Set(actors.map(e => e.actor_name || e.actor_id))].sort();
  if (whoSel.options.length <= 1) {
    const idMap = {};
    actors.forEach(e => { idMap[e.actor_name || e.actor_id] = e.actor_id; });
    who_set.forEach(w => whoSel.insertAdjacentHTML('beforeend', `<option value="${idMap[w]}">${w}</option>`));
  }
  const el = document.getElementById('feed');
  el.innerHTML = evs.map(e => `
    <div class="ev">
      <div><span class="who">${e.actor_name || e.actor_id}</span>
        <span class="what"> ${actionZh(e.action)} ${e.target_id ? `<code style="font-size:11px">${e.target_id}</code>` : ''}</span></div>
      <div class="when">${e.ts}${e.run_id ? ` · <a href="javascript:;" onclick="goReview('${e.run_id}')">${e.run_id}</a>` : ''}</div>
      ${e.detail?.description ? `<div class="det">“${e.detail.description}”</div>` : ''}
      ${e.detail?.subject ? `<div class="det">subject: ${e.detail.subject}${e.detail.parent_run ? ' · 再生自 ' + e.detail.parent_run : ''}</div>` : ''}
      ${e.detail?.poses ? `<div class="det">动作：${e.detail.poses.join(', ')}</div>` : ''}
    </div>`).join('') || '<div class="empty">暂无事件</div>';
}
function actionZh(a) {
  return { run_created: '发起了生成', accepted: '定稿了', rejected: '拒绝了',
           regenerate: '再生了', axis_promoted: '晋升了选项',
           proposal_rejected: '驳回了提案', undo: '撤销了操作', redo: '重做了操作',
           distill_run: '运行了蒸馏', pose_batch: '批量生成了动作' }[a] || a;
}

show('new');
loadDict().then(() => {
  // 评审页「载入迭代」跳转：带 run id 自动回填
  const goto = localStorage.getItem('ac-goto-iterate');
  if (goto) {
    localStorage.removeItem('ac-goto-iterate');
    fillFromRun(goto);
  }
});
